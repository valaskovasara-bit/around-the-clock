<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>AROUND THE CLOCK | Naše šipky</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f7f8fc;font-family:system-ui,-apple-system,sans-serif}main{max-width:800px;margin:auto;padding:14px 14px 45px}h1{font-size:28px;margin:8px 0}h2{font-size:18px;margin:10px 0}.muted{color:#b6c2d7;font-size:13px}.panel{background:#1b283b;border:1px solid #34445b;border-radius:16px;padding:13px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.grow{flex:1}.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.player{border:2px solid #445;border-radius:15px;padding:12px;min-width:0}.player.active{box-shadow:0 0 0 2px #f4e49e}.player .score{font-size:36px;font-weight:800}.player .name{font-size:18px;font-weight:800}button,select,input{font:inherit;border-radius:11px;border:1px solid #61728a;min-height:44px}button{background:#33455f;color:white;padding:10px 13px;font-weight:750;cursor:pointer;touch-action:manipulation}button:disabled{opacity:.35}button.primary{background:#d3ad48;color:#141923;border:0}button.red{background:#8b2c3b}button.blue{background:#1f578b}button.selected{outline:3px solid #fff}input,select{background:#263750;color:white;padding:8px;max-width:100%}.hits{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}.hits button{font-size:20px;padding:9px 0;min-height:56px}.controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.controls button{padding:10px 2px}.note{color:#e9d79b}.log{font-size:13px;line-height:1.6;max-height:110px;overflow:auto}.pill{background:#2b405a;border-radius:99px;padding:6px 11px}.hidden{display:none}.big{font-size:22px;font-weight:800}.danger{color:#ffadb4}@media(min-width:550px){.hits{grid-template-columns:repeat(7,minmax(0,1fr))}}</style></head><body><main><div class="muted">NAŠE ŠIPKY · samostatná hra</div><h1>AROUND THE CLOCK 🎯</h1><div class="muted">Pořadí po obvodu terče: 20 → 1 → 18 → … → 5 → Bull · tři šipky na tah</div><div class="panel" id="setup"><h2>Nastavení před začátkem</h2><div class="row"><input id="name0" aria-label="První hráč"><input id="name1" aria-label="Druhý hráč"></div><button class="primary" id="apply" style="margin-top:9px">Použít nastavení</button></div><div class="panel"><div class="players" id="players"></div><h2 id="turn"></h2><div class="muted" id="status"></div></div><div id="game"></div><div class="panel"><div class="muted">Zadané šipky v tomto tahu</div><div id="darts" class="big" style="margin:7px 0"></div><div class="row"><button id="undo">↶ ZPĚT</button><button id="next" class="primary grow">Další hráč →</button></div></div><div class="panel"><div class="muted">Poslední události</div><div id="log" class="log"></div><button id="restart" class="red" style="margin-top:12px">Nová hra</button></div></main><script>const GAME="around-the-clock";const $=id=>document.getElementById(id);const clone=o=>JSON.parse(JSON.stringify(o));const key='nase-sipky-'+GAME+'-v2';let state;let history=[];function save(){try{localStorage.setItem(key,JSON.stringify({state,history:history.slice(-150)}))}catch(e){}}function load(){try{const o=JSON.parse(localStorage.getItem(key));if(o&&o.state&&Array.isArray(o.state.players)){state=o.state;history=o.history||[];return}}catch(e){}reset()}function reset(){state={players:[{name:'SÁJA',color:'#d63c45',score:0},{name:'VOKUREK',color:'#2878d0',score:0}],turn:0,darts:[],round:1,finished:false,winner:null,log:[],config:{}};history=[];initialize();save()}function commit(){history.push(clone(state));if(history.length>150)history.shift()}function undo(){if(!history.length)return;state=history.pop();save();render()}function endTurn(){if(state.finished)return;commit();finishTurn();save();render()}function nextPlayer(){state.turn=(state.turn+1)%state.players.length;if(state.turn===0)state.round++}function playerHTML(p,i){return `<div class="player ${state.turn===i&&!state.finished?'active':''}" style="border-color:${p.color}"><div class="name" style="color:${p.color}">${p.name}</div><div class="score">${p.score}</div><div class="muted">${playerMeta(i)}</div></div>`}function render(){ $('players').innerHTML=state.players.map(playerHTML).join('');$('turn').textContent=state.finished?'🏆 Vítěz: '+state.players[state.winner].name:'Na řadě: '+state.players[state.turn].name;$('darts').textContent=state.darts.length?state.darts.map(x=>x.label).join(' · '):'Zatím žádná šipka';$('undo').disabled=!history.length;$('next').disabled=state.finished;renderGame();$('log').textContent=state.log.slice(-7).reverse().join(' | ');$('setup').classList.toggle('hidden',state.round>1||state.players.some(p=>p.score!==0)||state.darts.length>0)}function addLog(t){state.log.push(t);if(state.log.length>120)state.log.shift()}function winner(i){state.finished=true;state.winner=i;addLog('🏆 Vyhrává '+state.players[i].name)}function setupPlayers(){const a=$('name0').value.trim()||'SÁJA',b=$('name1').value.trim()||'VOKUREK';state.players[0].name=a;state.players[1].name=b;setupGame();save();render()}function restart(){if(confirm('Opravdu začít úplně novou hru?')){reset();render()}}function init(){load();$('undo').onclick=undo;$('next').onclick=endTurn;$('restart').onclick=restart;$('apply').onclick=setupPlayers;$('name0').value=state.players[0].name;$('name1').value=state.players[1].name;render()}window.addEventListener('DOMContentLoaded',init);
const ORDER=[20,1,18,4,13,6,10,15,2,17,3,19,7,16,8,11,14,9,12,5];function initialize(){state.extra={positions:[1,1]}}function setupGame(){}function playerMeta(i){let p=state.extra.positions[i];return p===21?'Čeká Bull':'Další: '+ORDER[p-1]}function hit(n){if(state.finished||state.darts.length>=3)return;commit();let i=state.turn,expected=state.extra.positions[i],ok=(expected===21&&(n===25||n===50))||n===ORDER[expected-1];state.darts.push({label:n===0?'MIMO':n===25?'BULL 25':n===50?'BULL 50':'ČÍSLO '+n,ok});if(ok){if(expected===21){winner(i)}else state.extra.positions[i]++;addLog(state.players[i].name+' trefil/a '+(expected===21?'Bull':ORDER[expected-1]))}if(state.darts.length===3&&!state.finished)finishTurn();save();render()}function finishTurn(){state.darts=[];nextPlayer()}function renderGame(){let expected=state.extra.positions[state.turn],h='<div class="panel"><h2>Další cíl: <span style="color:#e8c875">'+(expected===21?'BULL':ORDER[expected-1])+'</span></h2><div class="muted">S, D i T platí jako jeden zásah. Každý má 3 šipky na tah. Po čísle 5 následuje Bull.</div><div class="hits" style="margin-top:14px">';if(expected===21){h+='<button onclick="hit(25)">BULL 25</button><button onclick="hit(50)">BULL 50</button>'}else{h+=`<button class="primary" onclick="hit(${ORDER[expected-1]})">TREFENO ${ORDER[expected-1]}</button>`}h+='<button onclick="hit(0)">MIMO</button></div><div class="note" style="margin-top:12px">Šipka '+(state.darts.length+1)+' ze 3</div></div>';$('game').innerHTML=h;$('status').textContent='Kolo '+state.round+' · každý postupuje vlastním tempem'}</script></body></html>
